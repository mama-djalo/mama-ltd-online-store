spring:
  application:
    name: ProductService



  #Datasource config (MySQL)
  datasource:
    url: jdbc:mysql://mysql-products:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: product_user
    password: product123
    driver-class-name: com.mysql.cj.jdbc.Driver

  #JPA or Hibernate settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true  
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Server port for this microservice
server:
  port: 8081
  address: 0.0.0.0  

#SpringDoc OpenAPI (Swagger UI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

  #Logging
logging:
  level:
    org.hibernate.SQL: DEBUG    

      



