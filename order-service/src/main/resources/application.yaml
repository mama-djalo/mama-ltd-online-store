spring:
  application:
    name: OrderService

  # Datasource config (MySQL example)
  datasource:
    url: jdbc:mysql://mysql-orders:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: order_user
    password: order_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Server port for this microservice
server:
    port: 8082
    address: 0.0.0.0 

# Logging
logging:
    level:
      org.hibernate.SQL: DEBUG
      com.mamaltd.orderservice.Client: DEBUG

# SpringDoc OpenAPI (Swagger UI)
springdoc:
    swagger-ui:
      path: /swagger-ui
    api-docs:
      path: /v3/api-docs   
# Feign Client configuration
feign:
    httpclient:
      enabled: true
    client:
      config:
        default:  
          loggerLevel: BASIC  

# Feign Client configuration for Product Service
product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}